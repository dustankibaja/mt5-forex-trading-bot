name: MT5 AI Bot safety tests

on:
  push:
    paths:
      - "mt5-ai-bot/**"
      - ".github/workflows/mt5-tests.yml"
  pull_request:
    paths:
      - "mt5-ai-bot/**"
      - ".github/workflows/mt5-tests.yml"

jobs:
  safety-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mt5-ai-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q src scripts tests
      - name: Validate PowerShell onboarding script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/start_demo_phone_bridge.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Run unit tests (no broker credentials)
        run: python -m pytest tests -q
