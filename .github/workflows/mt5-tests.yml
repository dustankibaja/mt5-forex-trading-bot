name: MT5 AI Bot safety tests

on:
  push:
    paths:
      - "mt5-ai-bot/**"
      - ".github/workflows/mt5-tests.yml"
  pull_request:
    paths:
      - "mt5-ai-bot/**"
      - ".github/workflows/mt5-tests.yml"

jobs:
  safety-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mt5-ai-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q src scripts tests
      - name: Validate PowerShell onboarding script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/start_demo_phone_bridge.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify all pairing PowerShell scripts parse
        shell: powershell
        run: |
          $scripts = @(
            'scripts/pairing_keys.ps1',
            'scripts/show_pairing.ps1',
            'scripts/start_demo_phone_bridge.ps1'
          )
          foreach ($path in $scripts) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$path PowerShell syntax errors: $($errors -join '; ')"
            }
          }
      - name: Test Windows DPAPI credentials persist and deliberately rotate
        shell: powershell
        run: |
          . ./scripts/pairing_keys.ps1
          $path = Join-Path $env:RUNNER_TEMP 'emtifize-keys-test.dpapi'
          $one = Get-PrivatePairingCredentials -Path $path -CreateIfMissing
          $two = Get-PrivatePairingCredentials -Path $path
          if ($one.read_token -ne $two.read_token -or
              $one.control_token -ne $two.control_token) {
            throw 'Windows pairing credentials were regenerated unexpectedly'
          }
          $encrypted = [System.IO.File]::ReadAllBytes($path)
          $raw = [System.Text.Encoding]::UTF8.GetString($encrypted)
          if ($raw.Contains($one.read_token) -or $raw.Contains($one.control_token)) {
            throw 'Plaintext credentials found on disk'
          }
          $rotated = Get-PrivatePairingCredentials -Path $path -Rotate
          if ($rotated.read_token -eq $one.read_token -or
              $rotated.control_token -eq $one.control_token) {
            throw 'Explicit rotation did not revoke earlier credentials'
          }
          Remove-Item -LiteralPath $path -Force
      - name: Run unit tests (no broker credentials)
        run: python -m pytest tests -q
